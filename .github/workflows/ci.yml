name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 单元与集成测试（离线基线，不调用模型）
        env:
          ATP_LLM_MODE: mock
        run: python -m pytest -q

      - name: 前端模板编译校验
        run: node scripts/check_web.js

      - name: 文档链接校验
        run: python scripts/check_docs.py

      - name: 基准集质检（来源可定位/标题可判定/无重复）
        env:
          ATP_LLM_MODE: mock
        run: |
          python run.py lint-golden \
            --prd data/prd/coupon-center-prd.md \
            --golden data/golden/coupon-golden.json

      - name: 端到端冒烟（mock 三模式 + 切片评测）
        env:
          ATP_LLM_MODE: mock
        run: |
          python run.py run --prd data/prd/coupon-center-prd.md --mode bare --auto
          python run.py eval \
            --prd coupon-center-prd \
            --golden data/golden/coupon-golden.json \
            --modes rag --sweep
